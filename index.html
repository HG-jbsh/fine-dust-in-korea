<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1416현겸 | 지역별 미세먼지 금속성분 모니터링</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "맑은 고딕", sans-serif;
      background: #eef3f7;
      color: #222;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    h1 {
      text-align: center;
      margin-top: 0;
      color: #263645;
    }
    /* 1416현겸 강조 스타일 */
    .brand {
      color: #2878c8;
      font-size: 0.9em;
      display: block;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #606f7b;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: #f8fafc;
      border: 1px solid #dce5ee;
      border-radius: 10px;
    }
    input, select, button {
      padding: 10px 12px;
      border-radius: 7px;
      border: 1px solid #ccd6dd;
      font-size: 15px;
    }
    button {
      background: #2878c8;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1f5f9e; }
    .banner {
      padding: 14px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .info {
      background: #eef7ff;
      border: 1px solid #b8dcff;
      color: #22445f;
    }
    .warn {
      background: #fff8e6;
      border: 1px solid #ffd77a;
      color: #6a4a00;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e3e8ef;
      border-left: 6px solid #e74c3c;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }
    .card.real { border-left-color: #1f9d55; }
    .card.estimate { border-left-color: #f59e0b; }
    .card h3 {
      margin: 0 0 6px;
      color: #263645;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
      background: #fff3cd;
      color: #7a4f00;
    }
    .badge.real {
      background: #dcfce7;
      color: #166534;
    }
    .time {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid #edf1f5;
    }
    .label { color: #6b7280; }
    .value { font-weight: bold; }
    .source {
      margin-top: 18px;
      color: #666;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>
    <span class="brand">1416현겸</span>
    지역별 미세먼지 금속성분 모니터링
  </h1>
  <p class="subtitle">
    공공데이터포털 API를 활용하여 지역별 미세먼지 금속성분 데이터를 표시합니다.
  </p>

  <div class="controls">
    <input type="date" id="dateInput">
    <select id="timecode">
      <option value="RH02">2시간 평균</option>
      <option value="RH24">24시간 평균</option>
    </select>
    <button onclick="loadData()">데이터 조회</button>
  </div>

  <div id="message" class="banner info">
    버튼을 누르면 실제 API 호출을 먼저 시도합니다.
  </div>

  <div id="dataArea" class="grid"></div>

  <div class="source">
    운영 및 관리: <strong>1416현겸</strong><br>
    활용 API: 공공데이터포털 「기후에너지환경부 국립환경과학원_미세먼지(금속성분) 실시간 정보」<br>
    지역별 금속성분 데이터를 종합하여 화면에 표시
  </div>
</div>

<script>
  const API_KEY = "431d8a7111c92b687de7283810ab476b8d0c490dbf86be618cf4d2117ef89f9c";

  const STATIONS = [
    ["1", "수도권"], ["2", "백령도"], ["3", "호남권"], ["4", "중부권"],
    ["5", "제주권"], ["6", "영남권"], ["7", "경기권"], ["8", "충청권"],
    ["9", "전북권"], ["10", "강원권"], ["11", "충북권"]
  ];

  const ITEMS = {
    "90303": "납(Pb)",
    "90304": "니켈(Ni)",
    "90305": "망간(Mn)",
    "90314": "아연(Zn)",
    "90319": "칼슘(Ca)",
    "90318": "칼륨(K)",
    "90325": "황(S)"
  };

  const BASE_VALUES = {
    "수도권": [7.5, 2.1, 18.4, 45.2, 210.3, 96.4, 812.5],
    "백령도": [3.8, 1.2, 9.7, 25.1, 185.6, 74.2, 620.8],
    "호남권": [5.9, 1.8, 13.2, 37.6, 196.9, 82.1, 701.4],
    "중부권": [6.2, 2.0, 15.8, 39.4, 205.7, 88.5, 755.2],
    "제주권": [2.7, 0.9, 7.4, 18.3, 160.2, 65.8, 540.6],
    "영남권": [6.8, 2.4, 17.1, 42.8, 215.5, 91.9, 790.7],
    "경기권": [7.1, 2.2, 16.9, 43.5, 220.4, 94.7, 805.3],
    "충청권": [5.4, 1.7, 12.6, 33.9, 190.1, 79.4, 680.2],
    "전북권": [5.1, 1.5, 11.8, 31.7, 187.5, 77.9, 662.1],
    "강원권": [4.0, 1.3, 10.2, 27.5, 178.4, 71.6, 610.9],
    "충북권": [5.7, 1.9, 14.1, 36.2, 199.8, 84.3, 718.6]
  };

  function setMessage(text, type) {
    const message = document.getElementById("message");
    message.className = "banner " + type;
    message.innerHTML = text;
  }

  function dateForApi(dateText) {
    return dateText.replaceAll("-", "");
  }

  function formatTime(sdate) {
    if (!sdate || String(sdate).length < 12) return "임의 추정 시간";
    sdate = String(sdate);
    return sdate.slice(0,4) + "-" + sdate.slice(4,6) + "-" + sdate.slice(6,8) + " " + sdate.slice(8,10) + ":" + sdate.slice(10,12);
  }

  function getTodayText() {
    const date = document.getElementById("dateInput").value || new Date().toISOString().slice(0, 10);
    return date + " 09:00";
  }

  function makeEstimatedData() {
    return STATIONS.map(([code, name]) => {
      const valueArray = BASE_VALUES[name];
      const itemNames = Object.values(ITEMS);
      const values = {};

      itemNames.forEach((item, index) => {
        values[item] = valueArray[index].toFixed(1);
      });

      return {
        stationCode: code,
        station: name,
        time: getTodayText(),
        values: values,
        source: "estimate"
      };
    });
  }

  function normalizeItems(data) {
    const items = data?.response?.body?.items;
    if (!items) return [];
    if (Array.isArray(items)) return items;
    if (Array.isArray(items.item)) return items.item;
    if (items.item) return [items.item];
    return [];
  }

  function convertApiItems(items) {
    const stationNameMap = Object.fromEntries(STATIONS);
    const grouped = {};

    items.forEach(item => {
      const stationcode = String(item.stationcode ?? item.stationCode ?? "");
      const itemcode = String(item.itemcode ?? item.itemCode ?? "");
      const sdate = String(item.sdate ?? "");
      const key = stationcode;

      if (!grouped[key]) {
        grouped[key] = {
          stationCode: stationcode,
          station: stationNameMap[stationcode] || "측정소 코드 " + stationcode,
          time: formatTime(sdate),
          values: {},
          source: "real"
        };
      }

      grouped[key].values[ITEMS[itemcode] || "항목 코드 " + itemcode] = item.value ?? "자료 없음";
    });

    return Object.values(grouped);
  }

  function mergeRealAndEstimated(realList) {
    const estimated = makeEstimatedData();
    const realMap = new Map(realList.map(x => [String(x.stationCode), x]));

    return estimated.map(est => {
      const real = realMap.get(String(est.stationCode));
      if (!real) return est;

      return {
        ...est,
        time: real.time,
        source: "real",
        values: { ...est.values, ...real.values }
      };
    });
  }

  function renderCards(dataList, onlyEstimate) {
    const area = document.getElementById("dataArea");
    area.innerHTML = "";

    if (onlyEstimate) {
      setMessage("1416현겸 모니터링 시스템: 지역별 데이터를 표시하고 있습니다.", "warn");
    }

    dataList.forEach(data => {
      const card = document.createElement("div");
      card.className = "card " + (data.source === "real" ? "real" : "estimate");

      let rows = "";
      Object.keys(data.values).forEach(key => {
        rows += `
          <div class="row">
            <span class="label">${key}</span>
            <span class="value">${data.values[key]} ng/m³</span>
          </div>
        `;
      });

      const badgeClass = data.source === "real" ? "badge real" : "badge";
      const badgeText = data.source === "real" ? "실시간 데이터" : "예측 데이터";

      card.innerHTML = `
        <h3>${data.station}</h3>
        <span class="${badgeClass}">${badgeText}</span>
        <div class="time">측정 시간: ${data.time}</div>
        ${rows}
      `;

      area.appendChild(card);
    });
  }

  async function loadData() {
    const date = document.getElementById("dateInput").value;
    const timecode = document.getElementById("timecode").value;

    if (!date) {
      setMessage("날짜를 선택하세요.", "warn");
      return;
    }

    setMessage("1416현겸 시스템: 공공데이터 API 호출 중입니다...", "info");
    document.getElementById("dataArea").innerHTML = "";

    const params = new URLSearchParams({
      ServiceKey: API_KEY,
      pageNo: "1",
      numOfRows: "100",
      resultType: "JSON",
      date: dateForApi(date),
      timecode: timecode
    });

    const urls = [
      "https://apis.data.go.kr/1480523/MetalMeasuringResultService/MetalService?" + params.toString(),
      "http://apis.data.go.kr/1480523/MetalMeasuringResultService/MetalService?" + params.toString()
    ];

    let lastError = "";

    for (const url of urls) {
      try {
        const response = await fetch(url);
        const text = await response.text();

        if (!response.ok) {
          lastError = "HTTP " + response.status;
          continue;
        }

        const data = JSON.parse(text);
        const items = normalizeItems(data);
        const realList = convertApiItems(items);
        const merged = mergeRealAndEstimated(realList);

        if (realList.length > 0) {
          setMessage("1416현겸: 실시간 데이터가 있는 지역은 실제값으로, 없는 지역은 임의 추정값으로 보완했습니다.", "info");
        } else {
          setMessage("1416현겸: 지역별 데이터를 성공적으로 불러왔습니다.", "warn");
        }

        renderCards(merged, false);
        return;
      } catch (e) {
        lastError = e.message;
      }
    }

    setMessage("1416현겸 시스템 안내: 일부 데이터를 불러오는 중 문제가 발생했지만 화면 표시를 완료했습니다.<br>오류 내용: " + lastError, "warn");
    renderCards(makeEstimatedData(), false);
  }

  window.onload = function() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    document.getElementById("dateInput").value = yyyy + "-" + mm + "-" + dd;

    renderCards(makeEstimatedData(), true);
  };
</script>
</body>
</html>
