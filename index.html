<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 대기오염 정보 대시보드</title>
    <!-- Chart.js 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select, button { padding: 10px 20px; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; }
        button:hover { background-color: #0056b3; }

        .metrics { display: flex; gap: 20px; margin-bottom: 30px; }
        .metric-card { flex: 1; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .metric-card h3 { margin: 0; color: #666; font-size: 14px; }
        .metric-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: #333; }

        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌡️ 실시간 대기오염 정보 대시보드</h1>
    </header>

    <div class="controls">
        <select id="sidoSelect">
            <option value="서울">서울</option>
            <option value="부산">부산</option>
            <option value="대구">대구</option>
            <option value="인천">인천</option>
            <option value="광주">광주</option>
            <option value="대전">대전</option>
            <option value="울산">울산</option>
            <option value="경기">경기</option>
            <option value="강원">강원</option>
            <option value="충북">충북</option>
            <option value="충남">충남</option>
            <option value="전북">전북</option>
            <option value="전남">전남</option>
            <option value="경북">경북</option>
            <option value="경남">경남</option>
            <option value="제주">제주</option>
            <option value="세종">세종</option>
        </select>
        <button onclick="updateData()">데이터 업데이트</button>
    </div>

    <div class="metrics">
        <div class="metric-card">
            <h3>평균 미세먼지 (PM10)</h3>
            <p id="avgPm10">- ㎍/㎥</p>
        </div>
        <div class="metric-card">
            <h3>평균 초미세먼지 (PM2.5)</h3>
            <p id="avgPm25">- ㎍/㎥</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="airChart"></canvas>
    </div>

    <div style="overflow-x:auto;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>측정소</th>
                    <th>측정시간</th>
                    <th>PM10</th>
                    <th>PM2.5</th>
                    <th>통합대기환경지수</th>
                </tr>
            </thead>
            <tbody>
                <!-- 데이터가 여기에 삽입됩니다 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const SERVICE_KEY = "431d8a7111c92b687de7283810ab476b8d0c490dbf86be618cf4d2117ef89f9c";
    let airChart;

    async function updateData() {
        const sido = document.getElementById('sidoSelect').value;
        const url = `http://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty?serviceKey=${SERVICE_KEY}&returnType=json&numOfRows=100&pageNo=1&sidoName=${encodeURIComponent(sido)}&ver=1.0`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const items = data.response.body.items;

            if (items && items.length > 0) {
                processAndRender(items);
            } else {
                alert("데이터를 찾을 수 없습니다.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("데이터를 불러오는 중 오류가 발생했습니다. (CORS 제한 확인 필요)");
        }
    }

    function processAndRender(items) {
        // 숫자형 변환 및 결측치 제거
        const validItems = items.filter(item => item.pm10Value && item.pm25Value && item.pm10Value !== '-' && item.pm25Value !== '-');
        
        const labels = validItems.map(item => item.stationName);
        const pm10Data = validItems.map(item => parseInt(item.pm10Value));
        const pm25Data = validItems.map(item => parseInt(item.pm25Value));

        // 메트릭 계산
        const avgPm10 = (pm10Data.reduce((a, b) => a + b, 0) / pm10Data.length).toFixed(2);
        const avgPm25 = (pm25Data.reduce((a, b) => a + b, 0) / pm25Data.length).toFixed(2);
        
        document.getElementById('avgPm10').innerText = `${avgPm10} ㎍/㎥`;
        document.getElementById('avgPm25').innerText = `${avgPm25} ㎍/㎥`;

        // 차트 업데이트
        renderChart(labels, pm10Data);

        // 테이블 업데이트
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        validItems.forEach(item => {
            const row = `<tr>
                <td>${item.stationName}</td>
                <td>${item.dataTime}</td>
                <td>${item.pm10Value}</td>
                <td>${item.pm25Value}</td>
                <td>${item.khaiValue || '-'}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function renderChart(labels, data) {
        const ctx = document.getElementById('airChart').getContext('2d');
        
        if (airChart) airChart.destroy(); // 기존 차트 제거

        airChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'PM10 농도 (㎍/㎥)',
                    data: data,
                    backgroundColor: 'rgba(255, 99, 132, 0.6)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: { title: { display: true, text: '측정소별 미세먼지 현황' } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }
</script>

</body>
</html>
