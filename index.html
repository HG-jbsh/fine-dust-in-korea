<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1416현겸 - 미세먼지 모니터링</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: 'Malgun Gothic', sans-serif; background: #f0f4f8; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { background: #2c3e50; color: white; padding: 30px; text-align: center; }
        .admin-badge { background: #3498db; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .controls { background: #f8f9fa; padding: 20px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
        input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #ddd; }
        button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; padding: 10px 25px; }
        button:hover { background: #2980b9; }
        .status-msg { padding: 15px; text-align: center; font-weight: bold; }
        .info { color: #3498db; background: #e8f4fd; }
        .error { color: #e74c3c; background: #fdeaea; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 25px; }
        .card { border: 1px solid #eee; border-radius: 12px; padding: 20px; border-top: 5px solid #3498db; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; }
        .label { color: #7f8c8d; font-size: 0.9em; }
        .value { font-weight: bold; color: #2c3e50; }
        .footer { text-align: center; padding: 20px; color: #95a5a6; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="admin-badge">SYSTEM ADMIN: 1416현겸</div>
        <h1>전국 미세먼지 금속성분 모니터링</h1>
    </div>

    <div class="controls">
        <input type="date" id="dateInput">
        <select id="timecode">
            <option value="RH02">2시간 평균</option>
            <option value="RH24">24시간 평균</option>
        </select>
        <button onclick="fetchData()">데이터 조회</button>
    </div>

    <div id="message" class="status-msg info">날짜를 선택하고 조회 버튼을 누르세요.</div>
    <div id="dataGrid" class="grid"></div>

    <div class="footer">
        © 2026 1416현겸. Data provided by National Institute of Environmental Research.
    </div>
</div>

<script>
    const API_KEY = "431d8a7111c92b687de7283810ab476b8d0c490dbf86be618cf4d2117ef89f9c";
    const STATIONS = {"1":"수도권","2":"백령도","3":"호남권","4":"중부권","5":"제주권","6":"영남권","7":"경기권","8":"충청권","9":"전북권","10":"강원권","11":"충북권"};
    const ITEMS = {"90303":"납(Pb)","90304":"니켈(Ni)","90305":"망간(Mn)","90314":"아연(Zn)","90319":"칼슘(Ca)","90318":"칼륨(K)","90325":"황(S)"};

    async function fetchData() {
        const date = document.getElementById('dateInput').value.replace(/-/g, '');
        const time = document.getElementById('timecode').value;
        const msgDiv = document.getElementById('message');
        const grid = document.getElementById('dataGrid');

        if(!date) { alert("날짜를 선택하세요."); return; }

        msgDiv.className = "status-msg info";
        msgDiv.innerText = "1416현겸 시스템이 데이터를 불러오는 중...";
        grid.innerHTML = "";

        const url = `https://apis.data.go.kr/1480523/MetalMeasuringResultService/MetalService?serviceKey=${API_KEY}&pageNo=1&numOfRows=100&resultType=JSON&date=${date}&timecode=${time}`;

        try {
            const response = await fetch(url);
            const json = await response.json();
            const items = json.response?.body?.items?.item;

            if(!items || items.length === 0) {
                msgDiv.className = "status-msg error";
                msgDiv.innerText = `⚠️ ${date} 데이터가 없습니다. (업데이트 지연 혹은 키 오류)`;
                return;
            }

            msgDiv.innerText = `✅ ${date} 데이터 조회 성공!
